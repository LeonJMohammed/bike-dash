# XcodeGen spec. The Mac runs `xcodegen generate` before every build, so
# BikeDash.xcodeproj is never edited by hand or committed.
name: BikeDash
options:
  bundleIdPrefix: com.jlmoh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  BikeDashCore:
    path: Packages/BikeDashCore
targets:
  BikeDash:
    type: application
    platform: iOS
    sources:
      - path: BikeDash
    dependencies:
      - package: BikeDashCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jlmoh.bikedash
        INFOPLIST_FILE: Config/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      gatherCoverageData: false
